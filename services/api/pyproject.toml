[project]
name = "ai-job-match-api"
version = "0.1.0"
description = "FastAPI backend for AI Job Match"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "python-multipart>=0.0.9,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "scikit-learn>=1.5,<2",
    "pyjwt>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3,<6",
]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
